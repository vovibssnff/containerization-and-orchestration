apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch
  labels:
    app: batch
    app.kubernetes.io/part-of: shop
spec:
  replicas: {{ .Values.batch.replicaCount }}
  selector:
    matchLabels:
      app: batch
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: batch
        app.kubernetes.io/part-of: shop
    spec:
      {{- with .Values.batch.priorityClass }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.batch.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: batch
          image: "{{ .Values.batch.image.repository }}:{{ .Values.batch.image.tag }}"
          imagePullPolicy: {{ .Values.batch.image.pullPolicy }}
          env:
            - name: MEMORY_MB
              value: {{ .Values.batch.memoryMB | quote }}
            - name: BURN_CPU
              value: {{ .Values.batch.burnCPU | quote }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.batch.resources | nindent 12 }}
