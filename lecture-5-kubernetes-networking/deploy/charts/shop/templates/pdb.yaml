apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  labels:
    app: api
    app.kubernetes.io/part-of: shop
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      app: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shop-postgres
  labels:
    app: postgres
    app.kubernetes.io/part-of: shop
spec:
  minAvailable: {{ .Values.postgres.pdb.minAvailable }}
  selector:
    matchLabels:
      app: postgres
