ipam:
  mode: kubernetes
kubeProxyReplacement: false
k8sServiceHost: 172.20.0.3
k8sServicePort: 6443
operator:
  replicas: 1
routingMode: tunnel
tunnelProtocol: vxlan
cni:
  exclusive: true
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enableOpenMetrics: true
    enabled:
      - dns:query
      - drop
      - tcp
      - flow
      - icmp
      - http
prometheus:
  enabled: true
