# Local release gate. Nothing here is installed into the kind cluster.
services:
  n8n:
    image: n8nio/n8n:1.114.0
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_METRICS: "true"
      N8N_METRICS_INCLUDE_API_ENDPOINTS: "true"
      N8N_METRICS_INCLUDE_API_METHOD_LABEL: "true"
      N8N_METRICS_INCLUDE_API_STATUS_CODE_LABEL: "true"
      N8N_METRICS_INCLUDE_MESSAGE_EVENT_BUS_METRICS: "true"
      N8N_ENCRYPTION_KEY: lab8-release-gate-local-key
      GENERIC_TIMEZONE: Europe/Moscow
      N8N_DIAGNOSTICS_ENABLED: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: fs
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
    volumes:
      - n8n:/home/node/.n8n
      - ./data:/data
      - ./skills:/skills:ro

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama

  ollama-shim:
    build: ./mcp
    command: ["python", "ollama_shim.py"]

  files-mcp:
    build: ./mcp
    command: ["python", "fileserver.py"]
    volumes:
      - ./data:/data

  incidents-mcp:
    build: ./mcp
    command: ["python", "incidents.py"]
    volumes:
      - ./data:/data

  ci-mock:
    build: ./mcp
    command: ["python", "ci_mock.py"]

  gate:
    build: ./mcp
    command: ["python", "gate_proxy.py"]
    ports:
      - "127.0.0.1:5680:5680"

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9098:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "127.0.0.1:3008:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  n8n:
  ollama:
