repositories:
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: grafana
    url: https://grafana.github.io/helm-charts
  - name: jaegertracing
    url: https://jaegertracing.github.io/helm-charts
  - name: wiremind
    url: https://wiremind.github.io/wiremind-helm-charts

releases:
  - name: kube-prometheus-stack
    namespace: monitoring
    createNamespace: true
    chart: prometheus-community/kube-prometheus-stack
    version: 92.14.1
    wait: true
    timeout: 900
    values:
      - values/kube-prometheus-stack.yaml

  - name: loki
    namespace: monitoring
    createNamespace: true
    chart: grafana/loki
    version: 7.5.0
    wait: true
    timeout: 900
    values:
      - values/loki.yaml

  - name: alloy
    namespace: monitoring
    createNamespace: true
    chart: grafana/alloy
    version: 1.15.0
    wait: true
    timeout: 600
    needs:
      - monitoring/loki
    values:
      - values/alloy.yaml

  - name: alloy-events
    namespace: monitoring
    createNamespace: true
    chart: grafana/alloy
    version: 1.15.0
    wait: true
    timeout: 600
    needs:
      - monitoring/loki
    values:
      - values/alloy-events.yaml

  - name: jaeger
    namespace: monitoring
    createNamespace: true
    chart: jaegertracing/jaeger
    version: 4.16.1
    wait: true
    timeout: 600
    values:
      - values/jaeger.yaml

  - name: karma
    namespace: monitoring
    createNamespace: true
    chart: wiremind/karma
    version: 2.13.1
    wait: true
    timeout: 600
    needs:
      - monitoring/kube-prometheus-stack
    values:
      - values/karma.yaml

  - name: alert-sink
    namespace: monitoring
    createNamespace: true
    chart: ../charts/alert-sink
    wait: true
    timeout: 300
