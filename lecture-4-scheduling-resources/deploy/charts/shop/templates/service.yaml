apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
    app.kubernetes.io/part-of: shop
spec:
  selector:
    app: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  labels:
    app: worker
    app.kubernetes.io/part-of: shop
spec:
  selector:
    app: worker
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
