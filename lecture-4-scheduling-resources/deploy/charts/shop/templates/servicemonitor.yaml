apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shop
  labels:
    app: api
    app.kubernetes.io/part-of: shop
spec:
  jobLabel: app
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [api, worker]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
